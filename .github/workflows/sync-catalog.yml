name: Sync charging station catalog

# Daily refresh of station records and the enriched dictionary fields
# (BEE, OpenStreetMap, OpenChargeMap and the legacy CPO sources).
# Free on public repositories using standard GitHub-hosted runners.

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily
  workflow_dispatch:

concurrency:
  group: ev-station-catalog-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Trigger catalog sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call sync-ev-stations (catalog mode)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL repository secret is not configured"
            exit 1
          fi

          response=$(curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -d '{"mode":"catalog"}' \
            "${SUPABASE_URL%/}/functions/v1/sync-ev-stations")

          echo "$response"
          echo "$response" | jq -e '.success == true' > /dev/null
