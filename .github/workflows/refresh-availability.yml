name: Refresh charging station availability

# Live connector status from OpenEV Delhi, Google Places and OCPI feeds.
# Updates only availability columns on existing stations, on a free public-repo runner.

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch:

concurrency:
  group: ev-station-availability-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Trigger availability refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call sync-ev-stations (availability mode)
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_URL:-}" ]; then
            echo "::error::SYNC_URL repository secret is not configured"
            exit 1
          fi

          response=$(curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            -d '{"mode":"availability"}' \
            "$SYNC_URL")

          echo "$response"
          echo "$response" | jq -e '.success == true' > /dev/null
